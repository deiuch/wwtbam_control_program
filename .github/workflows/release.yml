name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Check versions
        shell: pwsh
        run: |
          $versions = foreach ($project in 'ControlProgram', 'FastestFingerFirst') {
            $info = Get-Content "src/$project/MyProject/AssemblyInfo.vb" -Raw
            foreach ($attribute in 'AssemblyVersion', 'AssemblyFileVersion') {
              [pscustomobject]@{ Name = "$project $attribute"; Version = [regex]::Match($info, "$attribute\(""([^""]+)""\)").Groups[1].Value }
            }
          }
          if (@($versions.Version | Sort-Object -Unique).Count -ne 1) {
            Write-Error ("Both programs must have one version: " + (($versions | ForEach-Object { "$($_.Name) = '$($_.Version)'" }) -join ', '))
            exit 1
          }
          $expected = "v$(([version]$versions[0].Version).ToString(3))"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $expected) {
            Write-Error "Tag ${{ github.ref_name }} does not match the programs' version $($versions[0].Version) (expected tag $expected)"
            exit 1
          }

      - name: Build and package
        run: msbuild src\WWTBAM.sln -p:Configuration=Release -m -nologo -verbosity:minimal

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-Item dist\*.zip
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload '${{ github.ref_name }}' $zip.FullName --clobber
          } else {
            gh release create '${{ github.ref_name }}' $zip.FullName --title $zip.BaseName --generate-notes
          }

      - name: Keep the archive
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*.zip
          retention-days: 7
